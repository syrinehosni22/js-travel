# Lance les 3 services : base MongoDB, API (server/) et site (client/)
#   docker compose up -d --build     →  site sur http://IP-DU-SERVEUR
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
  api:
    build: ./server
    restart: unless-stopped
    env_file: server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/tunisia-tours
    volumes: [uploads:/app/uploads]
    depends_on: [mongo]
  web:
    build: ./client
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [api]
volumes:
  mongo-data:
  uploads:
