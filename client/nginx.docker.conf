server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25M;

    location /api/     { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
    location /uploads/ { proxy_pass http://api:4000; expires 30d; }
    location = /sitemap.xml { proxy_pass http://api:4000; proxy_set_header Host $host; }
    location = /robots.txt  { proxy_pass http://api:4000; proxy_set_header Host $host; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
