upstream js_travel_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name 163.245.217.83;

    root /var/www/js-travel;
    index index.html;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://js_travel_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://js_travel_api;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml { proxy_pass http://js_travel_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /robots.txt  { proxy_pass http://js_travel_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /brand/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; }

    access_log /var/log/nginx/js-travel.access.log;
    error_log  /var/log/nginx/js-travel.error.log;
}
